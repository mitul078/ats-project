version: "3.9"

services:
  redis:
    image: redis:7
    container_name: ats-project
    ports:
      - "6379:6379"
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - REDIS_URI=redis://redis:6379
    depends_on:
      - redis
    volumes:
      - uploads-data:/app/uploads
    expose:
      - "4000"
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env
    environment:
      - REDIS_URI=redis://redis:6379
    depends_on:
      - redis
    volumes:
      - uploads-data:/app/uploads
    deploy:
      replicas: 2

  nginx:
    image: nginx:alpine
    container_name: ats-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

volumes:
  uploads-data:
